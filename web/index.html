<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GACOM - Game. Connect. Dominate. Africa's premier social gaming platform.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GACOM">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#E84B00">
  <title>GACOM</title>

  <!-- Round favicon from Cloudinary -->
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/dtchp470a/image/upload/c_fill,g_face,h_192,r_max,w_192/v1775540390/WhatsApp_Image_2026-03-27_at_03.12.01_3_jxyhbj.jpg">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">

  <!-- FIX: Dark background prevents white flash while Flutter loads -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background-color: #080808;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    /* Loading splash shown before Flutter boots */
    #gacom-splash {
      position: fixed;
      inset: 0;
      background: #080808;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #gacom-splash.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #gacom-splash img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 48px rgba(232, 75, 0, 0.55);
      animation: splashPulse 1.8s ease-in-out infinite;
    }
    #gacom-splash .title {
      font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: #F0F0F0;
      letter-spacing: 10px;
      margin-top: 20px;
    }
    #gacom-splash .tagline {
      font-family: 'Rajdhani', -apple-system, sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: #E84B00;
      letter-spacing: 4px;
      margin-top: 6px;
    }
    #gacom-splash .bar-wrap {
      width: 48px;
      height: 2px;
      background: #242424;
      border-radius: 2px;
      margin-top: 60px;
      overflow: hidden;
    }
    #gacom-splash .bar {
      height: 100%;
      background: #E84B00;
      border-radius: 2px;
      animation: splashBar 1.6s ease-in-out infinite;
    }
    @keyframes splashPulse {
      0%, 100% { box-shadow: 0 0 48px rgba(232,75,0,0.55); }
      50%       { box-shadow: 0 0 72px rgba(232,75,0,0.85); }
    }
    @keyframes splashBar {
      0%   { width: 0%;   margin-left: 0; }
      50%  { width: 100%; margin-left: 0; }
      100% { width: 0%;   margin-left: 100%; }
    }
  </style>

  <!-- Paystack Popup JS (for web payment) -->
  <script src="https://js.paystack.co/v1/inline.js"></script>

  <!-- model_viewer_plus REQUIRED setup: the package needs this loaded manually,
       it does not inject itself. Using the package's own bundled copy (not an
       external CDN) so 3D rendering never depends on outside network reachability. -->
  <script type="module" src="./assets/packages/model_viewer_plus/assets/model-viewer.min.js" defer></script>

  <script>
    // ── Round favicon via canvas ──────────────────────────────────────────────
    window.addEventListener('load', function () {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = 'https://res.cloudinary.com/dtchp470a/image/upload/v1775540390/WhatsApp_Image_2026-03-27_at_03.12.01_3_jxyhbj.jpg';
      img.onload = function () {
        const canvas = document.createElement('canvas');
        canvas.width = 64; canvas.height = 64;
        const ctx = canvas.getContext('2d');
        ctx.beginPath();
        ctx.arc(32, 32, 32, 0, Math.PI * 2);
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(img, 0, 0, 64, 64);
        const link = document.querySelector("link[rel='icon']") || document.createElement('link');
        link.type = 'image/png'; link.rel = 'icon'; link.href = canvas.toDataURL();
        document.head.appendChild(link);
      };
    });

    // ── Paystack Popup function called from Flutter via dart:js ──────────────
    // Flutter calls: window.paystackPay(publicKey, amountKobo, email, reference, callbackUrl)
    window.paystackPay = function(publicKey, amountKobo, email, reference, callbackUrl) {
      var handler = PaystackPop.setup({
        key: publicKey,
        email: email,
        amount: amountKobo,
        ref: reference,
        currency: 'NGN',
        channels: ['card', 'bank', 'ussd', 'qr', 'bank_transfer'],
        metadata: {
          custom_fields: [
            { display_name: 'Platform', variable_name: 'platform', value: 'GACOM' }
          ]
        },
        callback: function(response) {
          // Payment successful — notify Flutter
          if (window.flutter_inappwebview) {
            window.flutter_inappwebview.callHandler('paystackSuccess', response.reference);
          } else if (window._paystackSuccessCallback) {
            window._paystackSuccessCallback(response.reference);
          }
          // Redirect back to wallet page
          if (callbackUrl) {
            window.location.href = callbackUrl + '?ref=' + response.reference + '&status=success';
          }
        },
        onClose: function() {
          if (window._paystackCloseCallback) {
            window._paystackCloseCallback();
          }
        }
      });
      handler.openIframe();
    };

    // ── Hide splash once Flutter has rendered ────────────────────────────────
    window._gacomHideSplash = function() {
      var splash = document.getElementById('gacom-splash');
      if (splash) {
        splash.classList.add('hidden');
        setTimeout(function() { splash.remove(); }, 500);
      }
    };

    // Fallback: hide splash after 8 seconds even if Flutter callback never fires
    setTimeout(function() { window._gacomHideSplash && window._gacomHideSplash(); }, 8000);
  </script>

  <!-- ── PWA install prompt ───────────────────────────────────────────────
       Chrome/Edge/Android: real native install prompt, captured via
       beforeinstallprompt (the browser itself only fires this when the
       app genuinely isn't installed yet — that IS the "who doesn't have
       it" detection, there's no separate API for it).
       iOS Safari: Apple provides no install-prompt API at all, so this
       shows manual "Add to Home Screen" instructions instead — that's a
       hard platform limitation, not something that can be coded around.
       Neither banner shows if the user is currently running the already-
       installed app (display-mode: standalone / navigator.standalone). -->
  <script>
    (function () {
      var deferredPrompt = null;
      var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      var isIOS = /iphone|ipad|ipod/i.test(window.navigator.userAgent) && !window.MSStream;

      if (isStandalone) return; // already installed and running as the app — never prompt

      function buildBanner(message, buttonText, onButton) {
        var banner = document.createElement('div');
        banner.id = 'gacom-install-banner';
        banner.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;' +
          'background:#141018;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;' +
          'border-top:2px solid #E84B00;font-family:Rajdhani,Arial,sans-serif;box-shadow:0 -4px 16px rgba(0,0,0,0.4);';
        var text = document.createElement('div');
        text.style.cssText = 'flex:1;font-size:13px;line-height:1.4;';
        text.textContent = message;
        var btn = document.createElement('button');
        btn.textContent = buttonText;
        btn.style.cssText = 'background:#E84B00;color:#fff;border:none;border-radius:8px;padding:10px 16px;' +
          'font-weight:700;font-size:13px;white-space:nowrap;cursor:pointer;';
        btn.onclick = onButton;
        var close = document.createElement('button');
        close.textContent = '×';
        close.setAttribute('aria-label', 'Dismiss');
        close.style.cssText = 'background:none;border:none;color:#888;font-size:22px;line-height:1;padding:0 4px;cursor:pointer;';
        close.onclick = function () {
          banner.remove();
          // Re-shows next new browser session, not permanently silenced —
          // a fully permanent dismissal would work against the actual
          // goal of getting more users onto the installed app.
          window.sessionStorage.setItem('gacom_install_dismissed', '1');
        };
        banner.appendChild(text);
        banner.appendChild(btn);
        banner.appendChild(close);
        return banner;
      }

      if (window.sessionStorage.getItem('gacom_install_dismissed')) return;

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        var banner = buildBanner('Install GACOM for the full app experience — faster, offline-ready, no browser bar.', 'INSTALL', function () {
          banner.remove();
          if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.finally(function () { deferredPrompt = null; });
          }
        });
        document.body.appendChild(banner);
      });

      if (isIOS) {
        window.addEventListener('load', function () {
          setTimeout(function () {
            if (document.getElementById('gacom-install-banner')) return;
            var banner = buildBanner('Install GACOM: tap the Share icon, then "Add to Home Screen".', 'GOT IT', function () {
              banner.remove();
              window.sessionStorage.setItem('gacom_install_dismissed', '1');
            });
            document.body.appendChild(banner);
          }, 2500);
        });
      }
    })();
  </script>
</head>
<body>
  <!-- Splash screen shown immediately — no white flash -->
  <div id="gacom-splash">
    <img
      src="https://res.cloudinary.com/dtchp470a/image/upload/v1775540390/WhatsApp_Image_2026-03-27_at_03.12.01_3_jxyhbj.jpg"
      alt="GACOM"
      onerror="this.style.display='none'"
    />
    <div class="title">GACOM</div>
    <div class="tagline">GAME. CONNECT. DOMINATE.</div>
    <div class="bar-wrap"><div class="bar"></div></div>
  </div>

  <!-- Flutter bootstrap — defer keeps it non-blocking -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
