[build]
  command = "bash build.sh"
  publish = "build/web"

[build.environment]
  FLUTTER_VERSION = "stable"

# ── Security headers ────────────────────────────────────────────────────────
# See docs/APPSEC_AUDIT.md. Notes:
#  - The old blanket "Access-Control-Allow-Origin = *" on /* is gone. Only the
#    public static build output (assets, canvaskit, icons) keeps it; the app,
#    the /supabase-proxy rewrite and /download no longer advertise wildcard CORS.
#  - Content-Security-Policy is REPORT-ONLY on purpose (it logs violations in
#    the browser console, nothing is blocked). PROMOTE TO ENFORCING after about
#    a week with no violations you care about:
#      1. open the live site, use every area (login, wallet + Paystack, voice
#         rooms, 3D models, games, blog images) with DevTools Console open
#      2. look for "[Report Only] Refused to ..." lines and add the host to the
#         matching directive below
#      3. rename the key Content-Security-Policy-Report-Only to
#         Content-Security-Policy, deploy, and re-test once
#    'unsafe-inline' for scripts/styles is needed today because web/index.html
#    has inline <script>/<style> blocks and Flutter injects styles; moving those
#    to files and using nonces/hashes is the follow-up that removes it.
#  - Replace the Supabase host below if the project ref ever changes.

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Embedder-Policy = "unsafe-none"
    Content-Security-Policy-Report-Only = """\
default-src 'self'; \
script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.gstatic.com https://js.paystack.co https://checkout.paystack.com; \
style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
font-src 'self' data: https://fonts.gstatic.com https://www.gstatic.com; \
img-src 'self' data: blob: https:; \
media-src 'self' blob: https:; \
connect-src 'self' blob: data: https://rxccipqvyrcfpsadgpzp.supabase.co wss://rxccipqvyrcfpsadgpzp.supabase.co https://api.paystack.co https://*.paystack.co https://www.gstatic.com https://fonts.gstatic.com https://fonts.googleapis.com https://res.cloudinary.com https://*.livekit.cloud wss://*.livekit.cloud; \
frame-src 'self' https://checkout.paystack.com https://js.paystack.co; \
worker-src 'self' blob:; \
object-src 'none'; \
base-uri 'self'; \
form-action 'self' https://checkout.paystack.com; \
frame-ancestors 'self'"""

# Public, static build output only: wildcard CORS is harmless here.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/canvaskit/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[redirects]]
  from = "/supabase-proxy/*"
  to = "https://rxccipqvyrcfpsadgpzp.supabase.co/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/download"
  to = "/download/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The files that decide which app version a browser loads must never be kept
# stale, or phones keep running an old build after a deploy.
[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
